<div class="login-page">
  <!-- Floating Background Tulips -->
  <div class="bg-decoration">
    <img src="assets/tulip-bouquet.png" class="floating-tulip tulip-1" alt="">
    <img src="assets/tulip-bouquet.png" class="floating-tulip tulip-2" alt="">
    <img src="assets/tulip-bouquet.png" class="floating-tulip tulip-3" alt="">
    <img src="assets/tulip-bouquet.png" class="floating-tulip tulip-4" alt="">
    <img src="assets/tulip-bouquet.png" class="floating-tulip tulip-5" alt="">
    <img src="assets/tulip-bouquet.png" class="floating-tulip tulip-6" alt="">
  </div>

  <div class="login-container">
    <div class="login-card card">
      <!-- Header -->
      <div class="login-header">
        <h1 class="login-title">Getting to Know You</h1>
        <p class="login-subtitle">Little questions, little stories, and a little more of you.</p>
      </div>

      <!-- Login Form -->
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
        <!-- Email Input -->
        <div class="form-group">
          <label for="email" class="form-label">Email</label>
          <input 
            type="email" 
            id="email" 
            formControlName="email"
            placeholder="your@email.com"
            class="form-input"
            [class.error]="email?.invalid && email?.touched"
          />
          <span class="form-error" *ngIf="email?.invalid && email?.touched">
            <span *ngIf="email?.errors?.['required']">Email is required</span>
            <span *ngIf="email?.errors?.['email']">Please enter a valid email</span>
          </span>
        </div>

        <!-- Password Input -->
        <div class="form-group">
          <label for="password" class="form-label">Password</label>
          <input 
            type="password" 
            id="password" 
            formControlName="password"
            placeholder="••••••••"
            class="form-input"
            [class.error]="password?.invalid && password?.touched"
          />
          <span class="form-error" *ngIf="password?.invalid && password?.touched">
            <span *ngIf="password?.errors?.['required']">Password is required</span>
            <span *ngIf="password?.errors?.['minlength']">Password must be at least 6 characters</span>
          </span>
        </div>

        <!-- Server Error -->
        <div class="server-error" *ngIf="error()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/>
            <line x1="12" y1="8" x2="12" y2="12"/>
            <line x1="12" y1="16" x2="12.01" y2="16"/>
          </svg>
          <span>{{ error() }}</span>
        </div>

        <!-- Submit Button -->
        <button 
          type="submit" 
          class="btn btn-primary btn-lg login-submit"
          [disabled]="loginForm.invalid || loading()"
        >
          <span *ngIf="!loading()">Continue</span>
          <span *ngIf="loading()" class="loading-text">
            <span class="spinner-small"></span>
            Loading...
          </span>
        </button>
      </form>
    </div>
  </div>
</div>
